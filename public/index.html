<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>Codex Viewer</h1>
          <p id="codex-home">Loading Codex data...</p>
        </div>
        <div class="actions">
          <button id="refresh-button" title="Refresh sessions">Refresh</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <span>Sessions</span>
            <span id="session-count" class="muted">0</span>
          </div>
          <div id="sessions" class="sessions"></div>
        </aside>

        <section class="content">
          <div id="empty" class="empty">Select a Codex session.</div>
          <div id="detail" class="detail hidden">
            <div class="detail-head">
              <div>
                <h2 id="session-title"></h2>
                <p id="session-meta" class="muted"></p>
              </div>
              <div id="live-state" class="live-state">idle</div>
            </div>

            <div class="stats" id="stats"></div>
            <div id="insights" class="insights"></div>

            <div class="tabs">
              <button class="tab active" data-tab="timeline">Timeline</button>
              <button class="tab" data-tab="last-response">Last Response</button>
              <button class="tab" data-tab="raw">Raw events</button>
            </div>

            <div id="timeline-tab" class="tab-panel"></div>
            <div id="last-response-tab" class="tab-panel hidden"></div>
            <div id="raw-tab" class="tab-panel hidden">
              <div class="raw-toolbar">
                <input id="raw-filter" placeholder="Filter raw JSON..." />
              </div>
              <pre id="raw-events"></pre>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
