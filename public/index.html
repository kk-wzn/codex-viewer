<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <div class="brand-line">
            <h1>Codex Viewer</h1>
            <span id="app-version" class="version-badge">v0.1.0</span>
          </div>
          <p id="codex-home">Loading Codex data...</p>
        </div>
        <div class="actions">
          <button id="refresh-button" title="Refresh sessions">Refresh</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <span>Sessions</span>
            <span id="session-count" class="muted">0</span>
          </div>
          <div class="session-toolbar">
            <input id="session-filter" placeholder="Search sessions..." />
          </div>
          <div id="sessions" class="sessions"></div>
        </aside>

        <section class="content">
          <div id="empty" class="empty">Select a Codex session.</div>
          <div id="detail" class="detail hidden">
            <div class="detail-head">
              <div>
                <h2 id="session-title"></h2>
                <p id="session-meta" class="muted"></p>
              </div>
              <div id="live-state" class="live-state">idle</div>
            </div>

            <div class="stats" id="stats"></div>
            <div id="insights" class="insights"></div>

            <div class="tabs" role="tablist" aria-label="Session views">
              <button class="tab active" data-tab="conversation" role="tab" aria-selected="true">Conversation</button>
              <button class="tab" data-tab="timeline" role="tab" aria-selected="false">Timeline</button>
              <button class="tab" data-tab="last-response" role="tab" aria-selected="false">Last Response</button>
              <button class="tab" data-tab="raw" role="tab" aria-selected="false">Raw events</button>
            </div>

            <div id="conversation-tab" class="tab-panel" role="tabpanel">
              <div class="conversation-toolbar">
                <input id="conversation-filter" placeholder="Search conversation..." />
                <label>
                  <input id="conversation-tools" type="checkbox" checked />
                  Tools
                </label>
                <label>
                  <input id="conversation-instructions" type="checkbox" />
                  Instructions
                </label>
                <label>
                  <input id="conversation-collapse" type="checkbox" checked />
                  Collapse tools
                </label>
              </div>
              <div id="conversation" class="conversation-list"></div>
            </div>
            <div id="timeline-tab" class="tab-panel hidden" role="tabpanel"></div>
            <div id="last-response-tab" class="tab-panel hidden" role="tabpanel"></div>
            <div id="raw-tab" class="tab-panel hidden" role="tabpanel">
              <div class="raw-toolbar">
                <input id="raw-filter" placeholder="Filter raw events, e.g. sender:tool type:response_item tool:exec_command" />
                <div id="raw-summary" class="raw-summary"></div>
              </div>
              <div id="raw-events" class="raw-events"></div>
            </div>
          </div>
          <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top" aria-hidden="true" disabled>↑</button>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
